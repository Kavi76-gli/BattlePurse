<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Player Room - Esports Match Hub</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#0b0b0b;
  --card:#161616;
  --accent:#00eaff;
  --success:#22c55e;
  --danger:#ef4444;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Poppins,system-ui;
  overflow-x:hidden;
}

/* ================= APP BAR ================= */
.app-bar{
  position:sticky;
  top:0;
  height:56px;
  background:#141414;
  display:flex;
  align-items:center;
  padding:0 16px;
  box-shadow:0 2px 8px #000;
  z-index:100;
}
.app-bar button{
  background:none;
  border:none;
  color:var(--accent);
  font-size:22px;
  margin-right:12px;
  cursor:pointer;
}
.app-bar .title{
  font-size:18px;
  font-weight:600;
  color:var(--accent);
}

/* ================ SWIPE BACK ================= */
.swipe-area{
  position:fixed;
  top:0;left:0;
  width:24px;height:100%;
  z-index:50;
}

/* ================= CONTAINER ================= */
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
  animation:slideIn .35s ease forwards;
}

/* ================= CARD ================= */
.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 0 15px #00000088;
}

/* ================= INPUT & BUTTON ================= */
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#0f0f0f;
  color:#fff;
  margin-top:12px;
}

button{
  padding:10px 18px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.btn-primary{background:var(--accent);color:#000}
.btn-refresh{background:#6366f1;color:#fff}

/* ================= TABLE ================= */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  background:#1f1f1f;
  border-radius:12px;
  overflow:hidden;
}
th,td{
  padding:10px;
  border-bottom:1px solid #333;
  text-align:left;
}
th{
  background:#111;
  color:var(--accent);
}
.muted{color:#9aa;font-size:13px}

/* ================= ANIMATIONS ================= */
@keyframes slideIn{
  from{transform:translateX(100%);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes slideOut{
  from{transform:translateX(0);opacity:1}
  to{transform:translateX(100%);opacity:0}
}

/* ===== SWIPE EDGE ===== */
.swipe-area{
  position:fixed;
  left:0;
  top:0;
  width:26px;
  height:100%;
  z-index:999;
}

/* swipe arrow feedback */
.swipe-arrow{
  position:fixed;
  left:-44px;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  background:rgba(0,0,0,.75);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#fff;
  box-shadow:0 0 16px rgba(0,250,255,.7);
  opacity:0;
  transition:all .18s ease;
  z-index:1001;
  pointer-events:none;
}

/* mobile only */
@media (min-width:900px){
  .app-bar, .swipe-area, .swipe-arrow{ display:none; }
}    
</style>
</head>
<body>
<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
  <!-- ANDROID APP BAR -->
<div class="app-bar">
  <button class="back-btn" onclick="goBack()">←</button>
  <span class="app-title">Player Match Room</span>
</div>

<!-- Swipe-back edge -->
<div class="swipe-area"></div>

<!-- Swipe arrow indicator -->
<div id="room-box" class="card">Loading...</div>

<input id="killsInput" type="number" placeholder="Enter Kills" style="display:none" />

<div style="max-width:420px;margin:8px auto;text-align:center">
  <button class="refresh" onclick="loadRoom()">🔄 Refresh</button>
  <button onclick="confirmJoin()">✅ Confirm Join</button>
</div>

<div id="teamTable"></div>
<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>
<script>
const matchId = new URLSearchParams(window.location.search).get("matchId");
let currentPrizeSystem = null;
let currentGame = "";

const NON_PRIZE_GAMES = ["Ludo", "Carrom", "8 Ball Pool", "Cricket"];

function normalizePrize(raw){
  if(!raw) return null;
  const r = String(raw).trim().toLowerCase();
  if(r.includes("kill")) return "kill_based";
  if(r.includes("team")) return "team_equal";
  return null;
}

function prizeLabel(code){
  return code === "kill_based" ? "Kill Based" :
         code === "team_equal" ? "Team Equal" : "";
}

async function loadRoom(){
  const box = document.getElementById("room-box");
  const teamTable = document.getElementById("teamTable");
  const killsInput = document.getElementById("killsInput");

  box.innerHTML = "Loading...";
  teamTable.innerHTML = "";

  try{
    const roomRes = await fetch(`https://battlepurse-2ch0.onrender.com/api/wallet/quickmatch/room/${matchId}`).then(r=>r.json());
    const pairsRes = await fetch(`https://battlepurse-2ch0.onrender.com/api/wallet/pairs/${matchId}`).then(r=>r.json());

    if(!roomRes.success){
      box.innerHTML = "<h3>Room Not Published Yet</h3><p class='note'>⏳ Please wait for admin.</p>";
      killsInput.style.display="none";
      return;
    }

    currentGame = pairsRes.game || roomRes.room.game;

    currentPrizeSystem = normalizePrize(
      pairsRes.prizeSystem || roomRes.room.prizeSystem
    );

    if (NON_PRIZE_GAMES.includes(currentGame)) {
      currentPrizeSystem = null;
      killsInput.style.display = "none";
    } else {
      killsInput.style.display = currentPrizeSystem === "kill_based" ? "block" : "none";
    }

    const r = roomRes.room;

    let prizeHTML = "";
    if (!NON_PRIZE_GAMES.includes(currentGame) && currentPrizeSystem) {
      prizeHTML = `<p><strong>Prize System:</strong> ${prizeLabel(currentPrizeSystem)}</p>`;
    }

    let roomHTML = `<h3>Room Published</h3>`;

    if (currentGame === "Ludo") {
      roomHTML += `<p><strong>Private Code:</strong> ${r.roomId}</p>`;
    }
    else if (currentGame === "Carrom") {
      roomHTML += `<p><strong>Room Code:</strong> ${r.roomId}</p>`;
    }
    else if (currentGame === "8 Ball Pool" || currentGame === "Cricket") {
      roomHTML += `
        ${
          r.message
            ? `<p><strong>Note:</strong> ${r.message}</p>`
            : `<p>No special note from admin.</p>`
        }
      `;
    }
    else {
      roomHTML += `
        <p><strong>Room ID:</strong> ${r.roomId}</p>
        <p><strong>Password:</strong> ${r.roomPassword}</p>
      `;
    }

    /* ❌ Start Time removed here */

    roomHTML += prizeHTML;

    if (currentGame !== "8 Ball Pool" && currentGame !== "Cricket") {
      if (r.message) {
        roomHTML += `<p><strong>Note:</strong> ${r.message}</p>`;
      }
    }

    roomHTML += `
      <button onclick="uploadResult()"
      style="
        margin-top:25px;
        background:#28c76f;
        padding:10px 20px;
        border-radius:10px;
        font-weight:600;
        cursor:pointer;
      ">
        📤 Upload Result Screenshot
      </button>
    `;

    box.innerHTML = roomHTML;

    renderTeamTable(pairsRes.players || []);

  }catch(err){
    console.error(err);
    box.innerHTML = "<h3>Error Loading Room</h3>";
  }
}



function renderTeamTable(players){
  const table = document.getElementById("teamTable");

  if(!Array.isArray(players) || players.length === 0){
    table.innerHTML = "<p class='muted'>No players joined yet</p>";
    return;
  }

  let html = `<table>
    <tr>
      <th>UID</th>
      <th>Name</th>
      <th>Team</th>
    </tr>
  `;

  const half = Math.ceil(players.length / 2);

  players.forEach((p,i)=>{
    const uid = p.uid || p.userId?._id || "-";
    const name = p.name || p.userId?.name || "Unknown";

    const team = p.team || (i < half ? "LION" : "TIGER");
    const color = team === "LION" ? "#ffcc00" : "#00eaff";

    // 🔗 Facebook link (player-specific)
    const fbLink =
  p.uid ||                // player already sent FB link as UID
  p.facebook ||
  p.facebookLink ||
  p.userId?.uid ||
  null;

let uidDisplay = uid;

// 🏏 Cricket → show clickable Facebook profile
if (currentGame?.toLowerCase() === "cricket" && fbLink && fbLink.includes("facebook.com")) {
  uidDisplay = `
    <a 
      href="${fbLink}" 
      target="_blank"
      rel="noopener"
      style="color:#00d5ff;text-decoration:underline;font-weight:500"
    >
      Open Profile
    </a>
  `;
}

    html += `
      <tr>
        <td>${uidDisplay}</td>
        <td>${name}</td>
        <td style="color:${color}">${team}</td>
      </tr>
    `;
  });

  html += "</table>";
  table.innerHTML = html;
}






async function uploadResult(){
  const killsInput = document.getElementById("killsInput");
  let kills = 0;

  if(currentPrizeSystem === "kill_based"){
    if(!killsInput.value) return alert("Enter kills first");
    kills = Number(killsInput.value);
  }

  const fileInput = document.createElement("input");
  fileInput.type="file";
  fileInput.accept="image/*";

  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async ()=>{
      const token = localStorage.getItem("token");
      if(!token) return alert("Login required");

      await fetch("https://battlepurse-2ch0.onrender.com/api/wallet/upload-result",{
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token },
        body: JSON.stringify({ matchId, kills, screenshotUrl: reader.result })
      }).then(r=>r.json()).then(d=> alert(d.msg));
    };

    reader.readAsDataURL(file);
  };

  fileInput.click();
}

function confirmJoin(){
  alert("You confirmed your participation");
}

loadRoom();

/* ⬅ BACK LOGIC (ANDROID STYLE) */
function goBack(){
  if(document.referrer && document.referrer !== location.href){
    history.back();
  }else{
    location.href="gamezone.html"; // fallback
  }
}

/* 👆 SWIPE BACK */
let startX=0, startY=0;
const arrow=document.querySelector('.swipe-arrow');

document.addEventListener("touchstart", e=>{
  const t=e.touches[0];
  if(t.clientX < 30){
    startX=t.clientX;
    startY=t.clientY;
    arrow.style.opacity="1";
  }
});

document.addEventListener("touchmove", e=>{
  if(!startX) return;
  const dx=e.touches[0].clientX - startX;
  if(dx>0){
    arrow.style.left=Math.min(dx-18,50)+"px";
  }
});

document.addEventListener("touchend", e=>{
  if(!startX) return;

  const dx=e.changedTouches[0].clientX - startX;
  const dy=Math.abs(e.changedTouches[0].clientY - startY);

  arrow.style.left="-44px";
  arrow.style.opacity="0";

  if(startX < 30 && dx > 90 && dy < 70){
    goBack();
  }
  startX=0;
});
async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);
</script>
<script src="nav.js"></script>
</body>
</html>
