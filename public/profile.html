<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#00faff;
  --bg:#0e1117;
  --card:#161b22;
  --text:#e6f1ff;
  --muted:#9fb3c8;
  --border:#00faff22;
}

/* ================= RESET ================= */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html, body{
  width:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  overflow-y:auto;
}

/* ================= APP BAR ================= */
/* header already fixed in global.css – keep visuals only */
.app-bar{
  height:68px;
  background:#0b0f14;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  border-bottom:1px solid var(--border);
}

.app-bar button{
  background:none;
  border:none;
  color:var(--primary);
  font-size:22px;
  cursor:pointer;
}

.app-title{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
}

/* ================= PAGE CONTENT ================= */
/* 🔥 DO NOT use height / vh / calc here */
.page{
  width:100%;
  padding:16px;
}

/* 🔥 THIS IS THE KEY FIX */
.page::after{
  content:"";
  display:block;
  height:96px; /* bottom-nav safe space */
}

/* ================= CONTENT CARD ================= */
.container{
  width:100%;
  max-width:560px;
  margin:0 auto 24px;
  background:var(--card);
  padding:20px;
  border-radius:20px;
  border:1px solid var(--border);
  box-shadow:0 0 20px #00faff22;
}

/* ================= AVATAR ================= */
.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:16px auto 10px;
  display:block;
  object-fit:cover;
  border:3px solid var(--primary);
}

.upload-btn{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

/* ================= USER INFO ================= */
.user-info{
  text-align:center;
  margin-bottom:18px;
}

.user-info div{
  font-size:14px;
  margin:6px 0;
  word-break:break-word;
}

/* ================= FORM ================= */
label{
  display:block;
  margin-top:14px;
  font-size:13px;
  color:var(--muted);
}

input{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid #00faff33;
  background:#0b0f14;
  color:var(--text);
  font-size:15px;
  outline:none;
}

input:focus{
  box-shadow:0 0 10px #00faff55;
}

input::placeholder{
  color:#7fa7b5;
}

input:disabled{
  opacity:.7;
  cursor:not-allowed;
}

/* ================= WALLET ================= */
.wallet{
  margin:22px 0;
  padding:22px;
  text-align:center;
  font-size:22px;
  font-weight:800;
  background:linear-gradient(180deg,#00faff33,#000);
  border-radius:18px;
  color:var(--primary);
}

/* ================= BUTTONS ================= */
.button{
  width:100%;
  padding:15px;
  border-radius:40px;
  border:none;
  margin-bottom:14px;
  font-size:16px;
  font-weight:700;
  background:var(--primary);
  color:#000;
  cursor:pointer;
}

.button:active{
  transform:scale(.98);
}

.button.secondary{
  background:#1a1a1a;
  color:#fff;
  border:1px solid #00faff33;
}

/* ================= ADMIN ================= */
#adminSection{
  display:none;
  margin-top:18px;
  padding:16px;
  background:#0b0f14;
  border-radius:16px;
  border:1px dashed #00faff44;
  text-align:center;
}

/* ================= MOBILE ================= */
@media(max-width:480px){

  .page{
    padding:14px;
  }

  .page::after{
    height:112px; /* extra space for mobile nav */
  }

  .container{
    padding:16px;
  }

  .wallet{
    font-size:20px;
  }

  .button{
    font-size:15px;
    padding:14px;
  }
}



</style> 

</head>

<body>
<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
<!-- Swipe-back edge -->
<div class="swipe-area"></div>

<!-- 🔝 App Bar -->
<div class="app-bar">
  <button onclick="goBack()">←</button>
  <div class="app-title">Profile</div>
</div>

<div class="container">

  <img id="avatar-img"
       src="https://img.icons8.com/color/96/user.png"
       class="avatar">

  <div class="upload-btn">
    <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar()">
  </div>

  <div class="user-info">
    <div><strong>Name:</strong> <span id="username">Loading...</span></div>
    <div><strong>Mobile:</strong> <span id="mobile">Loading...</span></div>
    <div><strong>Email:</strong> <span id="email">Loading...</span></div>
    <div><strong>User ID:</strong> <span id="userid">Loading...</span></div>
  </div>

  <label>Free Fire UID</label>
  <input type="text" id="ffid" disabled>

  <label>BGMI UID</label>
  <input type="text" id="bgmiid" disabled>

  <label>Carrom Pool UID</label>
  <input type="text" id="carrom" disabled>

  <label>Ludo King UID</label>
  <input type="text" id="ludo" disabled>

  <div class="wallet">
    Wallet Balance: ₹<span id="wallet">0</span>
  </div>

  <button class="button" onclick="location.href='deposite.html'">💰 Deposit</button>
  <button class="button" onclick="location.href='withdral.html'">🏦 Withdraw</button>
  <button class="button secondary" onclick="location.href='transaction.html'">📜 Transaction History</button>

  <div id="adminSection">
    <h3>Admin Actions</h3>
    <button class="button" onclick="location.href='admin.html'">👮 Admin Panel</button>
  </div>

</div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>


<script>
/* ================= AUTH ================= */
const token = localStorage.getItem("token");
if (!token) {
  alert("Please login first");
  location.href = "login.html";
}


/* ⬅ BACK LOGIC (ANDROID STYLE) */
function goBack() {
  if (document.referrer && document.referrer !== location.href) {
    history.back();
  } else {
    location.href = "gamezone.html"; // fallback
  }
}

/* 👆 SWIPE BACK */
let startX = 0;
document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});
document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  if (startX < 40 && endX - startX > 90) {
    goBack();
  }
});



const avatarImg = document.getElementById("avatar-img");
const avatarInput = document.getElementById("avatarInput");

/* ================= LOAD PROFILE ================= */
async function loadProfile() {
  try {
    const res = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/profile",
      {
        headers: { Authorization: "Bearer " + token }
      }
    );

    const data = await res.json();

    // 🚫 HANDLE BANNED USER
    if (!res.ok) {
      if (res.status === 403) {
        alert(data.msg || "Your account has been banned due to unusual activity.");
        localStorage.removeItem("token");
        location.replace("auth.html"); // or banned.html
        return;
      }

      // ❌ TOKEN INVALID / OTHER ERRORS
      alert(data.msg || "Session expired. Please login again.");
      localStorage.removeItem("token");
      location.replace("auth.html");
      return;
    }

    // ✅ SAFE TO USE DATA
    const u = data.user;

    username.innerText = u.name || "Player";
    mobile.innerText = u.phone || "-";
    email.innerText = u.email || "Not set";
    userid.innerText = u.id;

    if (u.avatarUrl) avatarImg.src = u.avatarUrl;

    const ids = u.uids || {};
    ffid.value = ids.freeFire || "";
    bgmiid.value = ids.bgmi || "";
    carrom.value = ids.carrom || "";
    ludo.value = ids.ludo || "";

    if (u.isAdmin) {
      adminSection.style.display = "block";
    }

    // 💰 LOAD WALLET
    const wbRes = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/balance",
      {
        headers: { Authorization: "Bearer " + token }
      }
    );

    const wb = await wbRes.json();
    wallet.innerText = wb.balance ?? 0;

  } catch (err) {
    console.error("Profile load error:", err);
    alert("Unable to load profile. Please try again.");
  }
}


/* ================= AVATAR UPLOAD ================= */
async function uploadAvatar() {
  const file = avatarInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image");
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    alert("Image must be less than 2MB");
    return;
  }

  const fd = new FormData();
  fd.append("avatar", file);

  try {
    const res = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/uploads-avatars",
      {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token
        },
        body: fd
      }
    );

    const d = await res.json();

    // ✅ SAFE CHECK
    if (!res.ok || d.success !== true) {
      throw new Error(d.msg || "Upload failed");
    }

    // ✅ ALWAYS USE SERVER URL
    avatarImg.src = d.url;

    alert("Avatar updated successfully");

  } catch (err) {
    console.error("Avatar upload error:", err);
    alert(err.message || "Avatar upload failed");
  }
}

async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);


window.onload = loadProfile;
</script>
<script src="nav.js"></script>
</body>
</html>
