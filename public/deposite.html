<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deposit</title>

<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --accent:#00faff;
  --accent-dark:#00c6ff;
  --bg:#111;
  --card:#1c1c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Poppins,system-ui,sans-serif;
  min-height:100vh;
  overflow-y:auto;
  padding-bottom:90px; /* space for bottom nav */
}

/* ================= PAGE CONTENT ================= */
.container{
  padding:20px;
  text-align:center;
}

h2{
  color:var(--accent);
  margin-bottom:18px;
}

/* ================= PLANS ================= */
.plans{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.plan-btn{
  padding:12px 22px;
  border-radius:30px;
  border:2px solid var(--accent);
  background:none;
  color:var(--accent);
  font-weight:600;
  cursor:pointer;
}

.plan-btn.selected{
  background:var(--accent);
  color:#000;
}

/* ================= CUSTOM AMOUNT ================= */
.custom-amount{
  margin-top:20px;
}

.custom-amount input{
  width:200px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,255,.4);
  background:#222;
  color:#fff;
}

/* ================= PAY BUTTON ================= */
.pay-btn{
  margin-top:26px;
  padding:14px 40px;
  border-radius:30px;
  border:none;
  font-size:16px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent-dark));
  color:#000;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU (RIGHT) ================= -->
<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
<!-- ================= MAIN ================= -->
<div class="container" id="depositCard">
  <h2>💰 Deposit to Wallet</h2>

  <div class="plans">
    <button class="plan-btn" onclick="selectAmount(this,300)">₹300</button>
    <button class="plan-btn" onclick="selectAmount(this,500)">₹500</button>
    <button class="plan-btn" onclick="selectAmount(this,1000)">₹1000</button>
    <button class="plan-btn" onclick="selectAmount(this,2000)">₹2000</button>
  </div>

  <div class="custom-amount">
    <p>Or enter custom amount</p>
    <input type="number" id="customAmount" placeholder="Min ₹300">
  </div>

  <button class="pay-btn" onclick="proceedToPayment()">Proceed to Payment</button>
</div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>


<script>
let selectedAmount = 0;
const API = "https://battlepurse-t4yn.onrender.com/api/wallet";
const token = localStorage.getItem("token");

/* ================= SELECT AMOUNT ================= */
function selectAmount(btn, amount){
  selectedAmount = amount;
  document.querySelectorAll(".plan-btn")
    .forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  document.getElementById("customAmount").value = "";
}

/* ================= PAYMENT ================= */
async function proceedToPayment(){
  const customVal = Number(document.getElementById("customAmount").value);

  if(customVal){
    if(customVal < 300) return alert("❗ Minimum ₹300");
    selectedAmount = customVal;
  }

  if(!selectedAmount) return alert("❗ Select amount first");
  if(!token) return alert("❗ Please login");

  try{
    const res = await fetch(`${API}/deposit-request`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify({amount:selectedAmount})
    });

    const data = await res.json();
    if(!data.success) throw new Error(data.msg);

    location.href = `payment.html?txnId=${data.txnId}&amount=${selectedAmount}`;
  }catch(err){
    alert("❌ "+err.message);
  }
}

async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-t4yn.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);

</script>

<script src="nav.js"></script>
</body>
</html>
