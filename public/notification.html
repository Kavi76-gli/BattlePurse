<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<link rel="stylesheet" href="global.css">
<style>
/* GLOBAL RESET */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body { 
  background: #0a0a0a; 
  color: #fff; 
  font-family: 'Poppins', sans-serif; 
  display: flex; 
  flex-direction: column; 
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: #111;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}
.header img { height: 40px; }
.header-icons { display: flex; gap: 15px; align-items: center; }
.header-icons i { font-size: 1.2rem; cursor: pointer; }
.balance { font-weight: bold; }

/* APP BAR */
.app-bar {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: #111;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}
.app-bar button {
  margin-right: 12px;
  background: #222;
  border: none;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.app-title { font-size: 1.3rem; font-weight: bold; }

/* MAIN CONTENT */
.content {
  flex-grow: 1;
  width: 100%;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SLIDE DOWN ANIMATION */
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

.notification-container {
  max-width: 500px;
  width: 100%;
  margin-bottom: 16px;
}

.notification {
  background: #141414;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  border-left: 4px solid #00faff;
  animation: slideDown 0.5s ease forwards;
}
.notification h4 { color: #00faff; margin-bottom: 5px; }
.notification p { font-size: 0.9rem; color: #ccc; }

/* SWIPE AREA */
.swipe-area {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 24px;
  z-index: 50;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  border-top: 1px solid #222;
  z-index: 100;
}
.bottom-nav .nav-item {
  color: #fff;
  text-align: center;
  font-size: 0.8rem;
  cursor: pointer;
}
.bottom-nav .nav-item i {
  display: block;
  font-size: 1.3rem;
  margin-bottom: 2px;
}

/* MOBILE TWEAKS */
@media (max-width: 480px) {
  .notification h4 { font-size: 1rem; }
  .notification p { font-size: 0.8rem; }
  .bottom-nav .nav-item span { font-size: 0.65rem; }
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>
  <div class="header-icons">
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>

<!-- Swipe-back edge -->
<div class="swipe-area"></div>

<!-- APP BAR -->
<div class="app-bar">
  <button onclick="goBack()">←</button>
  <div class="app-title">Notifications</div>
</div>

<!-- ================= MAIN CONTENT ================= -->
<div class="content">
  <div class="notification-container" id="notifications">
    <!-- Notifications will be dynamically added here -->
    <div class="notification">
      <h4>No notifications yet</h4>
      <p>Notifications will appear here when available.</p>
    </div>
  </div>
</div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>

<script>
// ====================== NAVIGATION ======================
function goPage(page) {
  if(page) window.location.href = page;
}

function toggleMenu() {
  document.getElementById('sideMenu').classList.toggle('active');
}

function goBack(){
  if(document.referrer && document.referrer !== location.href){
    history.back();
  } else {
    goPage('gamezone.html');
  }
}

// ====================== DUMMY NOTIFICATIONS ======================
const notifications = [
  { title: "Tournament Reminder", msg: "Your tournament starts in 30 minutes!" },
  { title: "Result Uploaded", msg: "Admin has uploaded the result for last match." },
  { title: "Deposit Successful", msg: "₹500 has been added to your wallet." },
];

// Render notifications
const container = document.getElementById('notifications');
container.innerHTML = ''; // clear existing
notifications.forEach(n => {
  const div = document.createElement('div');
  div.className = 'notification';
  div.innerHTML = `<h4>${n.title}</h4><p>${n.msg}</p>`;
  container.appendChild(div);
});
</script>
<script src="nav.js"></script>
</body>
</html>
