<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>More</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --accent:#00faff;
}

*{box-sizing:border-box;}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background-color: var(--bg);
  color: #fff;
  padding-bottom: 70px; /* space for footer */
}

/* ================= APP BAR ================= */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  height: 56px;
  background: var(--card);
  padding: 0 16px;
  box-shadow: 0 2px 6px #00000080;
}

.app-bar button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 22px;
  margin-right: 12px;
  cursor: pointer;
}

.app-bar .title {
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}

/* ================= MORE OPTIONS ================= */
.more-options {
  padding: 20px;
  margin-top: 0;
}

.option {
  background: var(--card);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,255,255,0.05);
  transition: background 0.2s ease;
  text-decoration: none;
  color: #fff;
  font-size: 16px;
}

.option:hover {
  background: #2a2a2a;
}

.option i {
  color: var(--accent);
  font-size: 20px;
}

/* ================= FOOTER NAV ================= */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--card);
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  border-top: 1px solid #333;
  z-index: 50;
}

.nav-btn {
  color: #aaa;
  text-align: center;
  font-size: 14px;
  cursor: pointer;
}

.nav-btn i {
  font-size: 20px;
  display: block;
}

.nav-btn.active {
  color: var(--accent);
}

/* ================= SWIPE AREA ================= */
.swipe-area {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 24px;
  z-index: 50;
}
</style>
</head>
<body>
<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
<!-- SWIPE BACK EDGE -->
<div class="swipe-area"></div>

<!-- APP BAR -->
<div class="app-bar">
  <button onclick="goBack()">←</button>
  <div class="title">⋯ More Options</div>
</div>

<!-- MORE OPTIONS LIST -->
<div class="more-options">
  <a href="setting.html" class="option"><span>Settings</span> <i>⚙️</i></a>
  <a href="help&support.html" class="option"><span>Help & Support</span> <i>❓</i></a>
  <a href="contactus.html" class="option"><span>Contact Us</span> <i>📩</i></a>
  <a href="logout.html" class="option"><span>Logout</span> <i>🚪</i></a>
</div>

<!-- FOOTER NAV -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>


<script>
/* ================= BACK LOGIC ================== */
function goBack() {
  if (document.referrer && document.referrer !== location.href) {
    history.back();
  } else {
    location.href = "gamezone.html"; // fallback
  }
}


async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-t4yn.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);
/* ================= SWIPE BACK ================== */
let startX = 0;
document.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  if (startX < 40 && endX - startX > 90) {
    goBack();
  }
});
</script>
<script src="nav.js"></script>
</body>
</html>
