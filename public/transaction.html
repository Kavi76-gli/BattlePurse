<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction History</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #111;
  --card: #1c1c1c;
  --accent: #00faff;
  --success: #00ff99;
  --error: #ff4444;
}

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: var(--bg);
  color: #fff;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.swipe-area { position: fixed; left:0; top:0; bottom:0; width:24px; z-index:50; touch-action: pan-y; }

.app-bar {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  height: 56px;
  background: var(--card);
  padding: 0 16px;
  box-shadow: 0 2px 6px #00000080;
  z-index: 100;
}
.app-bar button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 22px;
  margin-right: 12px;
  cursor: pointer;
}
.app-bar .title {
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}

#transactionCard {
  flex: 1;
  max-width: 450px;
  margin: 10px auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  animation: slideIn 0.3s ease forwards;
}

.balance-box {
  margin-bottom: 15px;
  padding: 15px;
  background: var(--card);
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 0 12px #00000044;
}
.balance-value { font-size:28px; font-weight:700; margin-top:8px; }

.transactions-container { display:flex; flex-direction: column; gap: 10px; }

.transaction {
  display:flex; justify-content:space-between; align-items:center;
  background:#1b1b1b; padding:12px; border-radius:10px; box-shadow:0 0 6px #00000044;
  transition: transform 0.2s ease;
}
.transaction:hover { transform: translateX(2px); }

.info .title { font-size:15px; font-weight:600; }
.info .date { font-size:12px; opacity:0.7; }
.amount { font-size:16px; font-weight:700; }

.no-records { text-align:center; margin-top:40px; opacity:0.7; font-size:15px; }

@keyframes slideIn { 0%{ transform:translateX(100%); opacity:0; } 100%{ transform:translateX(0); opacity:1; } }
@keyframes slideOut { 0%{ transform:translateX(0); opacity:1; } 100%{ transform:translateX(100%); opacity:0; } }



.header-balance{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  background:#111;
  border-radius:20px;
  font-size:14px;
  font-weight:500;
  color:#ccc;
  border:1px solid #2a2a2a;
}

.wallet-balance{
  color:#00ff99;
  font-weight:700;
  font-size:15px;
}
</style>
</head>
<body>
<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('deposite.html')">Deposit</li>
    <li onclick="goPage('withdral.html')">Withdraw</li>
    <li onclick="goPage('transaction.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('kavi.html')">Free Fire/BGMI</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('more.html')">Settings</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
<div class="swipe-area"></div>


<!-- second place example -->
<div class="header-balance">
  Wallet Balance: <span class="wallet-balance">₹0</span>
</div>

  <div class="transactions-container" id="transactions"></div>
  <div class="no-records" id="emptyMsg" style="display:none;">No transactions found</div>
</div>
<!-- ================= BOTTOM NAV ================= -->
<!-- BOTTOM NAV -->
<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>


<script>
async function loadTransactions() {
  try {
    const token = localStorage.getItem("token");
    if (!token) { alert("Login required!"); return; }

    const res = await fetch("https://battlepurse-t4yn.onrender.com/api/wallet/transactions", {
      headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();

    const container = document.getElementById("transactions");
    container.innerHTML = "";

    const balances = document.querySelectorAll(".wallet-balance");

balances.forEach(el => {
  el.innerText = "₹" + Number(data.balance || 0).toFixed(2);
});

    if (!data.success || !data.transactions.length) {
      document.getElementById("emptyMsg").style.display = "block";
      return;
    }

    data.transactions.forEach(txn => {
      const amount = txn.amount;
      const type = txn.type;
      const date = new Date(txn.createdAt).toLocaleString();

      // Map type to title
      let title = "";
      if (type === "deposit") title = "Deposit";
      else if (type === "withdrawal") title = "Withdrawal";
      else if (type === "tournament") title = "Tournament Joined";
      else if (type === "MATCH_REWARD") title = "Match Reward";
      else if (type === "winning") title = "Tournament Award";
      else if (type === "refund") title = "Refund";
      else title = type;

      // Strict + / - and color logic
      let sign = "+";
      let color = "#00ff99"; // green default

      if (type === "withdrawal" || type === "debit" || type === "tournament") {
        sign = "-";
        color = "#ff4444"; // red
      }

      if (type === "deposit" || type === "winning" || type === "MATCH_REWARD" || type === "refund") {
        sign = "+";
        color = "#00ff99"; 
      }

      const div = document.createElement("div");
      div.className = "transaction";
      div.innerHTML = `
        <div class="info">
          <div class="title">${title}</div>
          <div class="date">${date}</div>
        </div>
        <div class="amount" style="color:${color}">${sign} ₹${amount}</div>
      `;
      container.appendChild(div);
    });
  } catch(err) {
    console.error("Error loading transactions:", err);
  }
}

window.onload = loadTransactions;

// BACK LOGIC
function goBack() {
  const card = document.getElementById("transactionCard");
  card.style.animation = "slideOut 0.3s forwards";
  setTimeout(() => {
    if (document.referrer && document.referrer !== location.href) history.back();
    else location.href = "gamezone.html";
  }, 300);
}


async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-t4yn.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);
// SWIPE BACK
let startX = 0;
document.addEventListener("touchstart", e => startX = e.touches[0].clientX);
document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  if (startX < 40 && endX - startX > 90) goBack();
});
</script>
<script src="nav.js"></script>
</body>
</html>
