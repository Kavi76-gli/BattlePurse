<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* =========================
   ROOT VARIABLES
========================= */
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --accent:#00faff;
  --text:#ffffff;

  /* 🔥 bottom nav height */
  --bottom-nav-height: 78px;
}

/* =========================
   RESET
========================= */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body{
  width:100%;
  height:100%;
}

/* =========================
   BODY
========================= */
body{
  font-family:'Poppins', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);

  /* 👇 IMPORTANT: space for fixed footer */
  padding-bottom: calc(var(--bottom-nav-height) + 20px);

  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
}

/* =========================
   APP BAR (TOP)
========================= */
.app-bar{
  position:sticky;
  top:0;
  height:56px;
  background:var(--card);
  display:flex;
  align-items:center;
  padding:0 16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
  z-index:1000;
}

.app-bar button{
  background:none;
  border:none;
  color:var(--accent);
  font-size:22px;
  margin-right:12px;
  cursor:pointer;
}

.app-bar .title{
  font-size:18px;
  font-weight:600;
  color:var(--accent);
}

/* =========================
   MAIN CONTAINER
========================= */
.container{
  max-width:480px;
  margin:20px auto;
  padding:20px;
}

/* =========================
   FORM
========================= */
.form-group{
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
  color:var(--accent);
}

input[type="text"],
input[type="password"],
input[type="number"]{
  width:100%;
  padding:14px;
  background:var(--card);
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:14px;
  box-shadow: inset 0 0 6px rgba(0,255,255,0.35);
}

input::placeholder{
  color:#888;
}

.button{
  width:100%;
  padding:15px;
  margin-top:24px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00faff,#00c6ff);
  color:#000;
  cursor:pointer;
  transition:0.25s ease;
}

.button:hover{
  opacity:0.85;
}

hr{
  border:none;
  border-top:1px solid #333;
  margin:26px 0;
}

/* =========================
   BOTTOM NAV (FIXED)
========================= */
footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:var(--bottom-nav-height);
  background:var(--card);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #333;
  z-index:999;
}

.nav-btn{
  flex:1;
  text-align:center;
  color:#aaa;
  font-size:12px;
  cursor:pointer;
}

.nav-btn i{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav-btn.active{
  color:var(--accent);
}

/* =========================
   EXTRA SAFETY SPACER
========================= */
.bottom-spacer{
  height:var(--bottom-nav-height);
}

/* =========================
   SWIPE BACK AREA
========================= */
.swipe-area{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:24px;
  z-index:10;
}

</style>
</head>
<body>
 

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="battlepurse.jpeg" onerror="this.style.display='none'">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>
    <div class="balance" id="balance">₹0.00</div>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="goPage('profile.html')">Profile</li>
    <li onclick="goPage('add-fund.html')">Deposit</li>
    <li onclick="goPage('withdraw.html')">Withdraw</li>
    <li onclick="goPage('transition.html')">Transactions</li>
    <li onclick="goPage('gamezone.html')">Game Zone</li>
    <li onclick="goPage('reer.html')">Refer & Earn</li>
    <li onclick="goPage('history.html')">History</li>
    <li onclick="goPage('ratio.html')">Ratios</li>
    <li onclick="goPage('logout.html')">Logout</li>
  </ul>
</div>
<!-- SWIPE BACK EDGE -->
<div class="swipe-area"></div>

<!-- APP BAR -->
<div class="app-bar">
  <button onclick="goBack()">←</button>
  <div class="title">Account Settings</div>
</div>



<!-- CONTAINER -->
<div class="container">

<label class="toggle">
  <span>Biometric Security</span>
  <input type="checkbox" id="bioToggle">
</label>


  <!-- Change Password -->
  <div class="form-group">
    <label for="oldPassword">Current Password</label>
    <input type="password" id="oldPassword" placeholder="Enter current password">
  </div>
  <div class="form-group">
    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" placeholder="Enter new password">
  </div>
  <button class="button" onclick="changePassword()">🔒 Change Password</button>

  <hr>

  <!-- Save Game UIDs -->
  <div class="form-group">
    <label for="ffid">Free Fire UID</label>
    <input type="text" id="ffid" placeholder="Free Fire UID">
  </div>
  <div class="form-group">
    <label for="bgmiid">BGMI UID</label>
    <input type="text" id="bgmiid" placeholder="BGMI UID">
  </div>
  
  <div class="form-group">
    <label for="ludoid">Ludo UID</label>
    <input type="text" id="ludoid" placeholder="Ludo UID">
  </div>
  <div class="form-group">
    <label for="carromid">Carrom UID</label>
    <input type="text" id="carromid" placeholder="Carrom UID">
  </div>
  

  <button class="button" onclick="saveUIDs()">💾 Save UIDs</button>
</div>
<div class="bottom-spacer"></div>

<!-- FOOTER NAV -->
<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="leaderboard.html" onclick="goPage('leaderboard.html')">
    <i class="fa-solid fa-trophy"></i><span>Leaderboard</span>
  </div>

  <div class="nav-item" data-page="history.html" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i><span>History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </div>

  <div class="nav-item" data-page="profile.html" onclick="goPage('profile.html')">
    <i class="fa-solid fa-user"></i><span>Profile</span>
  </div>

  <div class="nav-item" data-page="more.html" onclick="goPage('more.html')">
    <i class="fa-solid fa-gear"></i><span>Settings</span>
  </div>
</div>


<script>
const token = localStorage.getItem("token");

/* ================= BACK LOGIC ================= */
function goBack() {
  if (document.referrer && document.referrer !== location.href) {
    history.back();
  } else {
    location.href = "gamezone.html"; // fallback
  }
}

/* ================= SWIPE BACK ================= */
let startX = 0;
document.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  if (startX < 40 && endX - startX > 90) {
    goBack();
  }
});


/* ================= BIOMETRIC TOGGLE ================= */
const toggle = document.getElementById("bioToggle");

// Load saved value
toggle.checked = localStorage.getItem("biometricEnabled") === "true";

toggle.onchange = () => {
  localStorage.setItem(
    "biometricEnabled",
    toggle.checked ? "true" : "false"
  );
  alert("Biometric setting updated");
};

/* ================= CHANGE PASSWORD ================= */
async function changePassword() {
  const oldPassword = document.getElementById("oldPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  if (!oldPassword || !newPassword) return alert("Please enter both current and new passwords.");

  try {
    const res = await fetch("https://battlepurse-2ch0.onrender.com/api/wallet/change-password", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ oldPassword, newPassword })
    });
    const data = await res.json();
    alert(data.msg || "Password change failed.");
  } catch (err) {
    console.error("Change password error:", err);
    alert("Error changing password.");
  }
}

/* ================= SAVE UIDS ================= */
async function saveUIDs() {
  const uids = {
    freeFire: document.getElementById("ffid").value.trim(),
    bgmi: document.getElementById("bgmiid").value.trim(),
    carrom: document.getElementById("carromid").value.trim(),
    ludo: document.getElementById("ludoid").value.trim(),
    
  };

  try {
    const res = await fetch("https://battlepurse-2ch0.onrender.com/api/wallet/save-uids", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify(uids)
    });
    const data = await res.json();
    alert(data.msg || "UID save failed.");
  } catch (err) {
    console.error("Save UID error:", err);
    alert("Error saving UIDs.");
  }
}

/* ================= LOAD EXISTING UIDS ================= */
async function loadExistingUIDs() {
  try {
    const res = await fetch("https://battlepurse-2ch0.onrender.com/api/wallet/profile", {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    const u = data?.user?.uids || {};

    document.getElementById("ffid").value = u.freeFire || "";
    document.getElementById("bgmiid").value = u.bgmi || "";
    document.getElementById("ludoid").value = u.ludo || "";
    document.getElementById("carromid").value = u.carrom || "";
    
  } catch(err) {
    console.error("Failed to load UIDs", err);
  }
}

async function loadWalletBalance() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(
      "https://battlepurse-2ch0.onrender.com/api/wallet/balance",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (data.success) {
      document.getElementById("balance").innerText =
        "₹" + Number(data.balance || 0).toFixed(2);
    }
  } catch (err) {
    console.error("❌ Wallet fetch error:", err);
  }
}

// load on page start
document.addEventListener("DOMContentLoaded", loadWalletBalance);
window.onload = loadExistingUIDs;
</script>
<script src="nav.js"></script>
</body>
</html>
