<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattlePurse • Auth</title>

<link rel="stylesheet" href="global.css">

<style>
/* ================= ROOT ================= */
:root{
  --blue:#00faff;
  --blue-glow:#00faff88;
  --bg-dark:#020814;
  --glass:rgba(6,18,32,.72);
}

/* ================= RESET ================= */
*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0a1f3a 0%, #020814 65%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  color:#e6f1ff;
}

/* ================= APP HEADER ================= */
.app-header{
  position:fixed;
  top:14px;
  left:14px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  border-radius:18px;
  background:rgba(0,15,30,.65);
  backdrop-filter:blur(14px);
  border:1px solid #00faff33;
  box-shadow:0 0 16px #00faff44;
}

.logo-wrap img{
  height:40px;
  filter:
    drop-shadow(0 0 6px var(--blue))
    drop-shadow(0 0 14px var(--blue-glow));
}

.brand-text{
  line-height:1.1;
}

.app-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:.8px;
  color:var(--blue);
  text-shadow:
    0 0 8px var(--blue),
    0 0 20px var(--blue-glow);
}

.app-tagline{
  font-size:11px;
  letter-spacing:.6px;
  color:#9befff;
  opacity:.85;
}

/* ================= AUTH CARD ================= */
.container{
  width:100%;
  max-width:420px;
  background:var(--glass);
  backdrop-filter:blur(16px);
  border-radius:24px;
  padding:26px;
  border:1px solid #00faff33;
  box-shadow:
    0 0 28px #00faff44,
    inset 0 0 18px #00faff11;
}

/* ================= TOGGLE ================= */
.toggle{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}

.toggle button{
  flex:1;
  padding:13px;
  border-radius:16px;
  background:transparent;
  border:1px solid #00faff55;
  color:var(--blue);
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.toggle button.active{
  background:linear-gradient(135deg,#00faff,#007bff);
  color:#001018;
  box-shadow:0 0 18px var(--blue);
}

/* ================= FORMS ================= */
form{display:none;}
form.active{display:block;}

h2{
  text-align:center;
  margin:8px 0 18px;
  color:var(--blue);
  letter-spacing:.6px;
}

/* ================= INPUT ================= */
input{
  width:100%;
  padding:14px;
  margin:9px 0;
  border-radius:14px;
  border:1px solid #00faff33;
  background:#020914;
  color:#e6f1ff;
  outline:none;
}

input::placeholder{color:#7fa7b5;}

input:focus{
  border-color:var(--blue);
  box-shadow:0 0 12px var(--blue-glow);
}

/* ================= BUTTONS ================= */
.submit{
  width:100%;
  padding:14px;
  margin-top:14px;
  border-radius:18px;
  border:none;
  font-weight:700;
  background:linear-gradient(135deg,#00faff,#006bff);
  color:#001018;
  cursor:pointer;
  box-shadow:0 0 20px var(--blue-glow);
}

.submit:active{transform:scale(.97);}

.link-btn{
  background:none;
  border:none;
  color:var(--blue);
  width:100%;
  margin-top:12px;
  cursor:pointer;
  font-size:14px;
}

/* ================= TIMER ================= */
.timer{
  text-align:center;
  margin-top:10px;
  color:#9fb3c8;
  font-size:13px;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
  .app-header{
    top:10px;
    left:10px;
    padding:8px 12px;
  }

  .logo-wrap img{height:34px;}

  .app-name{font-size:15px;}
  .app-tagline{font-size:10px;}

  .container{
    padding:22px;
    border-radius:20px;
  }
}
</style>

</head>

<body>

<div class="app-header">
  <div class="logo-wrap">
    <img src="file_00000000c938722f8d26b428d0c8069c.png" alt="BattlePurse">
  </div>

  <div class="brand-text">
    <div class="app-name">BattlePurse</div>
    <div class="app-tagline">Play • Win • Withdraw</div>
  </div>
</div>


<div class="container">

<!-- TOGGLE -->
<div class="toggle">
  <button id="loginBtn" class="active">Login</button>
  <button id="registerBtn">Register</button>
</div>

<!-- LOGIN -->
<form id="loginForm" class="active">
  <h2>Welcome Back</h2>
  <input id="loginMobile" placeholder="Mobile Number">
  <input id="loginPassword" type="password" placeholder="Password">
  <button class="submit">Login</button>
  <button type="button" class="link-btn" onclick="showForgot()">Forgot Password?</button>
</form>

<!-- REGISTER -->
<form id="registerForm">
  <h2>Create Account</h2>
  <input id="regName" placeholder="Full Name">
  <input id="regMobile" placeholder="Mobile Number">
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">
  <input id="regRePassword" type="password" placeholder="Confirm Password">
  <button type="button" class="submit" onclick="sendRegisterOTP()">Send Email OTP</button>
  <input id="regOtp" placeholder="Enter OTP" style="display:none">
  <div id="regTimer" class="timer" style="display:none">
    Resend OTP in <span id="regCount">60</span>s
  </div>
  <button id="regResendBtn" class="link-btn" style="display:none" onclick="resendRegisterOTP()">Resend OTP</button>
  <button id="verifyBtn" class="submit" style="display:none" onclick="verifyRegisterOTP()">Verify & Register</button>
</form>

<!-- FORGOT -->
<form id="forgotForm">
  <h2>Reset Password</h2>
  <input id="fpMobile" placeholder="Mobile Number">
  <input id="fpEmail" placeholder="Registered Email">
  <button type="button" class="submit" onclick="sendForgotOTP()">Send OTP</button>
  <input id="fpOtp" placeholder="OTP" style="display:none">
  <input id="fpNewPass" type="password" placeholder="New Password" style="display:none">
  <div id="fpTimer" class="timer" style="display:none">
    Resend OTP in <span id="fpCount">60</span>s
  </div>
  <button id="fpResendBtn" class="link-btn" style="display:none" onclick="resendForgotOTP()">Resend OTP</button>
  <button id="fpVerifyBtn" class="submit" style="display:none" onclick="resetPassword()">Reset Password</button>
</form>

</div>




<script>
const API = "https://battlepurse-t4yn.onrender.com/api/wallet";

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const forgotForm = document.getElementById("forgotForm");

loginBtn.onclick = () => showForm("login");
registerBtn.onclick = () => showForm("register");

function showForm(type){
  loginForm.classList.remove("active");
  registerForm.classList.remove("active");
  forgotForm.classList.remove("active");
  loginBtn.classList.remove("active");
  registerBtn.classList.remove("active");
  if(type==="login"){loginForm.classList.add("active"); loginBtn.classList.add("active");}
  if(type==="register"){registerForm.classList.add("active"); registerBtn.classList.add("active");}
}

function showForgot(){
  loginForm.classList.remove("active");
  forgotForm.classList.add("active");
}

function startTimer(countEl, timerBox, resendBtn){
  let t=60;
  resendBtn.style.display="none";
  timerBox.style.display="block";
  countEl.innerText=t;
  const i=setInterval(()=>{
    t--;
    countEl.innerText=t;
    if(t<=0){clearInterval(i); timerBox.style.display="none"; resendBtn.style.display="block";}
  },1000);
}

/* ================= REGISTER ================= */
async function sendRegisterOTP(){
  if(regPassword.value!==regRePassword.value){alert("Password mismatch"); return;}
  try{
    const res = await fetch(API+"/register-email",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:regName.value, phone:regMobile.value, email:regEmail.value, password:regPassword.value})
    });
    const d = await res.json();
    if(!res.ok){alert(d.msg); return;}
    regOtp.style.display="block"; verifyBtn.style.display="block"; regResendBtn.style.display="none";
    startTimer(regCount, regTimer, regResendBtn);
  }catch(e){alert("Registration failed: "+e.message);}
}

async function resendRegisterOTP(){
  try{
    const res = await fetch(API+"/resend-otp",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:regEmail.value, purpose:"register"})
    });
    const d = await res.json();
    if(!res.ok){alert(d.msg); return;}
    alert("New OTP sent!"); startTimer(regCount, regTimer, regResendBtn);
  }catch(e){alert("Failed to resend OTP: "+e.message);}
}


/* ================= REGISTER ================= */

async function verifyRegisterOTP(){
  // ⛔ prevent form default behavior (very important)
  event.preventDefault();

  // Basic check
  if (!regOtp.value) {
    alert("Please enter OTP");
    return;
  }

  try {
    const res = await fetch(API + "/verify-email-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: regEmail.value.trim(),
        otp: regOtp.value.trim()
      })
    });

    const d = await res.json();

    // ❌ OTP FAILED → STAY ON REGISTER PAGE
    if (!res.ok) {
      alert(d.msg || "Invalid or expired OTP");
      return; // ⛔ STOP HERE (NO PAGE CHANGE)
    }

    // ✅ OTP SUCCESS
    alert("Registered Successfully!");

    // Clear register form (optional but clean)
    registerForm.reset();

    // Hide OTP-related UI
    regOtp.style.display = "none";
    verifyBtn.style.display = "none";
    regTimer.style.display = "none";
    regResendBtn.style.display = "none";

    // ✅ ONLY NOW go to login page
    showForm("login");

  } catch (err) {
    alert("OTP verification failed. Please try again.");
  }
}



/* ================= LOGIN ================= */
loginForm.onsubmit = async e => {
  e.preventDefault();
  try {
    const res = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: loginMobile.value, password: loginPassword.value })
    });

    const d = await res.json();

    if (!res.ok) {
      // ❌ Wrong password or user not found → STAY on login page
      alert(d.msg || "Login failed. Check your credentials.");
      return;
    }

    // ✅ Login successful → only now go to gamezone
    localStorage.setItem("token", d.token);
    location.href = "gamezone.html";

  } catch(e){
    alert("Login failed: "+e.message);
  }
};



/* ================= FORGOT PASSWORD ================= */
async function sendForgotOTP(){
  try{
    const res = await fetch(API+"/forgot/send-otp",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone:fpMobile.value,email:fpEmail.value})
    });
    const d = await res.json();
    if(!res.ok){alert(d.msg); return;}
    fpOtp.style.display="block"; fpNewPass.style.display="block"; fpVerifyBtn.style.display="block"; fpResendBtn.style.display="none";
    startTimer(fpCount, fpTimer, fpResendBtn);
  }catch(e){alert("Failed to send OTP: "+e.message);}
}

async function resendForgotOTP(){
  try{
    const res = await fetch(API+"/resend-otp",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:fpEmail.value, purpose:"forgot"})
    });
    const d = await res.json();
    if(!res.ok){alert(d.msg); return;}
    alert("New OTP sent!"); startTimer(fpCount, fpTimer, fpResendBtn);
  }catch(e){alert("Failed to resend OTP: "+e.message);}
}

async function resetPassword(){
  try{
    const res = await fetch(API+"/forgot/reset",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone:fpMobile.value,email:fpEmail.value,otp:fpOtp.value,newPassword:fpNewPass.value})
    });
    const d = await res.json();
    if(!res.ok){alert(d.msg); return;}
    alert("Password updated successfully"); fpOtp.value=""; fpNewPass.value=""; showForm("login");
  }catch(e){alert("Reset failed: "+e.message);}
}
</script>
<script src="nav.js"></script>
</body>
</html>
